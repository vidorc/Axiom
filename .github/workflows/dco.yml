# DCO — verifies every commit in a PR carries a `Signed-off-by` trailer.
# Axiom uses the DCO, not a CLA (ADR-0007, CONTRIBUTING.md). A missing sign-off
# blocks the merge until the author amends (`git commit --amend -s`).

name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dco-check:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the full PR commit range to inspect each commit message.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          # Inspect each commit in the PR range.
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            subject="$(git show -s --format='%s' "$sha")"
            author="$(git show -s --format='%an <%ae>' "$sha")"
            # Merge commits (2+ parents) are exempt.
            parents="$(git show -s --format='%P' "$sha" | wc -w)"
            if [ "$parents" -ge 2 ]; then
              echo "skip (merge) $sha"
              continue
            fi
            signoff="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | head -n1)"
            if [ -z "$signoff" ]; then
              echo "::error::Missing Signed-off-by on $sha — \"$subject\""
              missing=1
            else
              echo "ok  $sha  ($signoff)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "One or more commits are not signed off. See CONTRIBUTING.md."
            echo "Fix the last commit:   git commit --amend -s --no-edit"
            echo "Fix a whole branch:    git rebase --signoff ${BASE_SHA}"
            exit 1
          fi
